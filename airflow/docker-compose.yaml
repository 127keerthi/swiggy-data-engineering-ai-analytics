services:

  postgres:
    image: postgres:16
    restart: unless-stopped

    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 10s
      timeout: 5s
      retries: 10

    volumes:
      - postgres-db-volume:/var/lib/postgresql/data


  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile

    user: "0:0"

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"

      AIRFLOW__API__BASE_URL: "http://localhost:8080"

      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://airflow:airflow@postgres/airflow"

      DBT_PROFILES_DIR: "/home/airflow/.dbt"

    env_file:
      - .env

    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./config:/opt/airflow/config
      - ../swiggy_dbt:/opt/airflow/swiggy_dbt
      - C:/Users/keert/.dbt:/home/airflow/.dbt:ro

    command:
      - bash
      - -c
      - |
        set -e

        echo "=========================================="
        echo "SWIGGY AIRFLOW INITIALIZATION"
        echo "=========================================="

        echo "Checking dbt profile..."

        if [ ! -f /home/airflow/.dbt/profiles.yml ]; then
          echo "ERROR: profiles.yml not found"
          exit 1
        fi

        echo "SUCCESS: profiles.yml found"

        echo "Checking dbt project..."

        if [ ! -f /opt/airflow/swiggy_dbt/dbt_project.yml ]; then
          echo "ERROR: dbt_project.yml not found"
          exit 1
        fi

        echo "SUCCESS: dbt project found"

        echo "Checking DAG..."

        if [ ! -f /opt/airflow/dags/swiggy_pipeline.py ]; then
          echo "ERROR: swiggy_pipeline.py not found"
          exit 1
        fi

        echo "SUCCESS: swiggy_pipeline.py found"

        echo "Initializing Airflow database..."

        airflow db migrate

        echo "Creating Airflow admin user..."

        airflow users create \
          --username admin \
          --password admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com || true

        echo "=========================================="
        echo "SWIGGY AIRFLOW INITIALIZATION COMPLETE"
        echo "=========================================="


  airflow-api-server:
    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"

      AIRFLOW__API__BASE_URL: "http://localhost:8080"

      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://airflow-api-server:8080/execution/"

      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://airflow:airflow@postgres/airflow"

      DBT_PROFILES_DIR: "/home/airflow/.dbt"

    env_file:
      - .env

    ports:
      - "8082:8080"

    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./config:/opt/airflow/config
      - ../swiggy_dbt:/opt/airflow/swiggy_dbt
      - C:/Users/keert/.dbt:/home/airflow/.dbt:ro

    command:
      - api-server
      - --host
      - "0.0.0.0"
      - --port
      - "8080"


  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"

      AIRFLOW__API__BASE_URL: "http://localhost:8080"

      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://airflow-api-server:8080/execution/"

      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://airflow:airflow@postgres/airflow"

      DBT_PROFILES_DIR: "/home/airflow/.dbt"

    env_file:
      - .env

    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./config:/opt/airflow/config
      - ../swiggy_dbt:/opt/airflow/swiggy_dbt
      - C:/Users/keert/.dbt:/home/airflow/.dbt:ro

    command:
      - scheduler


  airflow-dag-processor:
    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"

      AIRFLOW__API__BASE_URL: "http://localhost:8080"

      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://airflow-api-server:8080/execution/"

      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://airflow:airflow@postgres/airflow"

      DBT_PROFILES_DIR: "/home/airflow/.dbt"

    env_file:
      - .env

    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./config:/opt/airflow/config
      - ../swiggy_dbt:/opt/airflow/swiggy_dbt
      - C:/Users/keert/.dbt:/home/airflow/.dbt:ro

    command:
      - dag-processor


  airflow-triggerer:
    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"

      AIRFLOW__API__BASE_URL: "http://localhost:8080"

      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://airflow-api-server:8080/execution/"

      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://airflow:airflow@postgres/airflow"

      DBT_PROFILES_DIR: "/home/airflow/.dbt"

    env_file:
      - .env

    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./config:/opt/airflow/config
      - ../swiggy_dbt:/opt/airflow/swiggy_dbt
      - C:/Users/keert/.dbt:/home/airflow/.dbt:ro

    command:
      - triggerer


volumes:
  postgres-db-volume: